# modified: 新增 GitHub Actions 工作流
#
# 目的：本机没有 JDK / Android SDK，无法产出 APK。让 GitHub 的免费 runner（自带
# Ubuntu + JDK + Android SDK）替我们编译，产物作为 Artifact 下载，手机直接安装。
# 这样"克隆即可运行"不再依赖本地装 Android Studio。
#
# 说明：
#   1) 用 gradle/actions/setup-gradle 指定 8.13，直接走 services.gradle.org 下载，
#      绕开 gradle-wrapper.properties 里的国内镜像（GitHub 机器访问腾讯镜像不稳）。
#   2) 先跑 JVM 单元测试（RoundPolicy / KeywordMatcher / PhoneNumbers / QuietHours），
#      这些纯 Java 规则不依赖真机，是本次改造唯一能自动化验证的部分。
#   3) 产出的是 debug 包，用 debug keystore 自动签名，可直接安装；不适合上架。
name: Build debug APK

on:
  push:
    branches: [ main ]
    # modified: 纯文档改动不触发构建，省 runner 分钟数
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare fixed signing keystore
        # modified: 固定签名材料。
        # 为什么需要：CI runner 每次都是全新机器，AGP 自动生成的 debug.keystore
        # 每次都是不同的 key，导致连续两次构建出的 APK 签名不一致（已实测比对
        # CERT.RSA 的 SHA-256 不同）。后果是新包无法覆盖安装旧包，必须卸载重装，
        # 而卸载会丢掉全部配置。
        # 这里的逻辑：仓库里没有 keystore 就在本次生成一份，用它签名并上传为
        # artifact；把该 artifact 下载后提交进仓库，之后本地与 CI 就永远用同一个 key。
        id: keystore
        run: |
          if [ -f keystore/bellgram.jks ]; then
            echo "仓库已存在固定 keystore，直接使用"
            echo "generated=false" >> "$GITHUB_OUTPUT"
          else
            mkdir -p keystore
            keytool -genkeypair -v \
              -keystore keystore/bellgram.jks \
              -storetype PKCS12 \
              -alias bellgram \
              -keyalg RSA -keysize 2048 -validity 10950 \
              -storepass bellgram -keypass bellgram \
              -dname "CN=Bellgram, OU=Personal, O=Self, L=Beijing, ST=Beijing, C=CN"
            echo "generated=true" >> "$GITHUB_OUTPUT"
            echo "⚠️ 本次新生成了签名 keystore，请下载 signing-keystore 工件并提交进仓库，"
            echo "   否则下次构建的签名会再次变化，导致无法覆盖安装。"
          fi

      - name: Upload generated keystore (first run only)
        if: steps.keystore.outputs.generated == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: signing-keystore
          path: keystore/bellgram.jks
          if-no-files-found: error
          retention-days: 30

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK platform 36
        # AGP 也能自动下载，这里显式装一次以缩短失败排查路径；失败不阻断。
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" || true

      - name: Run JVM unit tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: bellgram-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 7
