// 二次开发说明（modified）：
//   1) apply plugin 保留原写法（与 buildscript classpath 配套），改动面最小；
//   2) 新增 namespace：AGP 8 起包名必须在这里声明，manifest 里的 package 已删除；
//   3) [v4·破坏性] compileSdk 34 -> 36、targetSdk 29 -> 36。
//      原因：2026-08-31 起 Google Play 要求新应用/更新 targetSdk >= 36（Android 16）；
//      且 targetSdk <= 34 的应用在更高版本系统上会被限制分发、并出现“为旧版 Android 打造”警告。
//      代价：targetSdk >= 31 后不允许从 SMS_RECEIVED 广播启动前台服务（官方豁免清单不含短信广播）。
//      本轮已把主链路重构为「高优先级通知 + 全屏 Intent + setAlarmClock 精确闹钟」，
//      前台服务只在用户可见（全屏告警页）时启动，因此不再依赖该豁免，详见 AUDIT_REPORT_V4.md §5.1。
//   4) [v4] 依赖调整：移除已废弃的 legacy-preference-v14，改用 androidx.preference 1.2.1；
//      新增 androidx.core 1.13.1 用于 edge-to-edge insets（targetSdk 35+ 强制全屏边到边）。
//      二者均为 Google 官方 AndroidX 稳定版，AAR 合计约 0.6 MB，无新增第三方/非官方依赖。
//   5) 显式指定 UTF-8 源码编码，避免中文注释在部分环境出现乱码告警。

apply plugin: 'com.android.application'

// modified: 【签名固定】固定签名材料的路径。
//
// 背景（这是实测出来的，不是推测）：GitHub Actions 的 runner 每次都是全新机器，
// AGP 会在 ~/.android/ 下自动生成 debug.keystore —— 每次都是**不同的 key**。
// 我比对过连续两次 CI 构建出的 APK，CERT.RSA 的 SHA-256 分别是 dce46633… 和
// bbb44ad0…，即签名不同。后果是：新版 APK 装不进已装旧版的手机，系统提示
// 「应用未安装」，必须卸载重装，而卸载会丢掉号码、关键词、命中记录全部配置。
//
// 因此仓库里固定一份自用签名 keystore/bellgram.jks，本地构建与 CI 共用同一个 key，
// 从此覆盖升级不再需要卸载。首次时该文件不存在（CI 会先生成并上传），
// 此时自动退回 AGP 默认 debug 签名，保证构建不会因此失败。
def fixedKeystore = rootProject.file('keystore/bellgram.jks')

android {
    // modified: AGP 8 要求显式 namespace
    namespace 'com.saiga.find.messagefinder'

    // modified: 29 -> 34 -> 36（Android 16；需安装 SDK Platform 36）
    compileSdk 36

    // modified: 固定签名。这是**个人自用**签名，不是发布密钥，未用于任何应用商店；
    // 口令明文放置是有意的——private 仓库 + 保证本地与 CI 签名完全一致可复现。
    // 如果将来要上架，请另建正式密钥并改用 CI Secrets / 本地 properties 读取。
    signingConfigs {
        if (fixedKeystore.exists()) {
            personal {
                storeFile fixedKeystore
                storePassword 'bellgram'
                keyAlias 'bellgram'
                keyPassword 'bellgram'
                // modified: v4.5.3 注释同步：保留 v1 以兼容旧版安装校验，同时启用 v2；
                // 仓库内固定 keystore 不变，历次构建可直接覆盖安装。
                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
    }

    defaultConfig {
        applicationId "com.saiga.find.messagefinder"
        // modified: v4.5.4 【修改】minSdk 36 -> 23，恢复 v4.5.2 及以前的兼容范围。
        // 原因：v4.5.3 按「只适配最新安卓」提到 36 后，非 Android 16 设备
        // 在解析阶段即被系统拒绝，安装提示「解析软件包时出现问题」，实测装不上。
        // 复核确认：抬高 minSdk 对瘦身没有任何贡献（v4.5.3 的体积收益全部来自
        // 删除内置铃声 + 显式压缩 DEX），反而触发 AGP 的 DEX 不压缩默认行为。
        // 故降回 23（Android 6.0+），功能、配置格式、固定签名均不变，可直接覆盖升级。
        minSdk 23
        // modified: 29 -> 36（本轮核心合规项，理由与配套架构改造见文件头与报告 §5.1）
        targetSdk 36
        // modified: v4.3.0 = 新图标、双主题、音量档位与提醒参数可配，versionCode 23 -> 24
        // modified: v4.3.1 = 源码层独立复审（主题重建轮次去重、音量守护恢复失败保留标记），
        //           versionCode 24 -> 25
        // modified: v4.4.0 = 首页「清除配置」迁入设置页并加二次确认、入口文案单行化、
        //           8 个下拉设置项改自绘单选弹窗（修复 dialogMessage 与列表冲突导致无选项），
        //           versionCode 25 -> 26；固定签名不变，可直接覆盖升级
        // modified: v4.5.0 = 全盘审计（设置页框架弹窗叠加、稍后提醒通知被撤、静音空转、
        //           换号后联系人姓名残留、时间/时区变更未重挂闹钟），新增「试响一次」自检，
        //           versionCode 26 -> 27；固定签名不变，可直接覆盖升级
        // modified: v4.5.1 = 修 v4.5.0 试响在部分机型「点了确认没反应」：试响原走
        //           mediaPlayback 前台服务，被 Android 12+ 启动限制 / 14+ 类型校验 /
        //           通知权限拦截后静默失败；改为设置页原地播放（AlertPreviewPlayer），
        //           失败原因直接回显。versionCode 27 -> 28；固定签名不变
        // modified: v4.5.2 = 首屏收成一页：删应用简介、红米四步提示、底部装饰图标，
        //           压缩间距；权限体检快捷入口由底部清单迁到状态条。
        //           versionCode 28 -> 29；固定签名不变，可直接覆盖升级
        // modified: v4.5.3 = minSdk 23 -> 36、删零引用依赖与死资源；
        //           彻底移除 res/raw/priority_ringtone.mp3 与 raw/keep.xml，
        //           新增 AlertRingtone 统一改取系统闹钟音（原 15 秒裁剪方案已弃用）。
        //           versionCode 29 -> 30；固定签名不变，可直接覆盖升级
        // modified: v4.5.4 = 修复「解析软件包时出现问题」：minSdk 36 -> 23。
        //           v4.5.3 仅 Android 16 可装，旧设备解析阶段即被拒；实测确认
        //           抬高 minSdk 未带来任何体积收益，降回不影响 6.53 MB 瘦身成果。
        //           versionCode 30 -> 31；固定签名不变，可直接覆盖升级
        // modified: v4.5.5 = 修复「再次输入新关键词会覆盖原有关键词」：
        //           首页输入框改为回填当前全部关键词（空闲时），新增「关键词库」
        //           对话框（空格分隔全量编辑 + 流式标签点 × 即删）；整框重写且
        //           与旧词无交集时弹「合并 / 替换」确认。AppConfig 新增
        //           saveKeywords() 只写关键词键，不动号码与配置键名/存储格式。
        //           versionCode 31 -> 32；固定签名不变，可直接覆盖升级
        // modified: v4.5.6 = 修复/排查「实测收到关键词短信却完全没反应」：
        //           新增 SmsTrace 接收诊断，把 SMSReceiver 的 7 处静默跳过、
        //           NotificationHelper 的通知静默放弃全部落到本机可查看日志；
        //           设置页新增「接收诊断」「模拟一条提醒短信」两个入口，首页状态条
        //           直接显示最近未触发原因；并修掉关键词库保存绕过 RECEIVE_SMS
        //           权限申请却把按钮改成「已启动」的回归。
        //           versionCode 32 -> 33；固定签名不变，可直接覆盖升级
        // modified: v4.5.7 = 修复「命中日志写入掐断提醒主链路」：原来 HitLog.add()
        //           排在 AlertDispatcher 之前且裸调 SharedPreferences，写日志失败会
        //           被 onReceive 的外层 catch 吞掉，表现为「没记录 + 完全没反应」；
        //           改为先派发、日志后置并各自吞异常，HitLog 补类型兜底。
        //           另外把「最近命中记录」入口直接接到完整诊断，诊断里新增
        //           当前规则与权限快照，一张截图即可判断广播未投递还是规则不匹配。
        //           versionCode 33 -> 34；固定签名不变，可直接覆盖升级
        // modified: v4.5.8 = 加固「不管短信应用是否弹窗/用户是否查看，本应用都要响」：
        //           SMS_RECEIVED 是有序广播，给 SMSReceiver 的 intent-filter 加
        //           priority=999（普通应用最高合规值），防止被默认短信应用/安全软件
        //           abort 截断；本接收器不调用 abortBroadcast，不影响短信应用。
        //           通知提至 PRIORITY_MAX + 锁屏公开可见，避免亮屏时横幅被压下去；
        //           诊断第一行补屏幕亮灭/锁屏状态，区分「广播没到」与「全屏页被系统降级」。
        //           versionCode 34 -> 35；固定签名不变，可直接覆盖升级
        versionCode 35 // modified: v4.5.8 发布
        versionName "4.5.8" // modified: v4.5.8 发布
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            // 调试包不做混淆，便于查看堆栈
            // modified: 有固定 keystore 就用它，保证 CI 产物能覆盖升级；否则用默认 debug 签名
            if (fixedKeystore.exists()) {
                signingConfig signingConfigs.personal
            }
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // modified: 同上，release 也走固定签名
            if (fixedKeystore.exists()) {
                signingConfig signingConfigs.personal
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
        // modified: 固定源码编码，保证中文注释与字符串正确编译
        encoding = 'UTF-8'
    }

    // modified: v4.5.3 【新增】强制压缩 DEX，抵消 minSdk 36 带来的 APK 膨胀。
    // v4.5.4 【保留】minSdk 已降回 23，此时 AGP 本来就默认压缩 DEX；仍显式
    // 声明是为了把「直接分发的 APK 必须压缩 DEX」固定成契约，将来若再抬高
    // minSdk（>= 28）也不会静默把包撑大 6 MB。
    // AGP 4.2 起，minSdk >= 28 时默认把 DEX「未压缩」打进 APK：装到设备上更小、
    // 启动更快，但直接分发的 APK 文件会明显变大（实测三个 DEX 由 4,463,635 B
    // 压缩态变成 10,598,512 B 裸存储，比 v4.5.2 反增 6.13 MB，把删铃声省下的
    // 3.13 MB 全部吃掉还倒贴）。本仓库直接分发 debug APK 文件，故显式改回压缩。
    // 依据：AGP 4.2 release notes「DEX files uncompressed in APKs when minSdk = 28
    // or higher」；AGP 8.0.2+ DSL 为 android.packaging.dex.useLegacyPackaging。
    packaging {
        dex {
            useLegacyPackaging = true
        }
    }

    lint {
        // v4 已清除 android.preference 等废弃 API；保留该开关是为了避免 OEM 相关
        // 的第三方库告警阻断本地调试打包（个人自用工程，不进 CI）。
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    // modified: 统一升级到与 compileSdk 36 匹配的稳定版本（原 1.2.0 / 1.3.0-alpha02）
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.activity:activity:1.9.1'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.google.android.material:material:1.12.0'
    // modified: v4.5.3 【删除】androidx.legacy 的 legacy-support-v4 依赖（早期遗留）
    // 全项目 0 个 import / 0 个引用，早期遗留依赖；功能未受影响。
    implementation 'de.hdodenhof:circleimageview:3.1.0'

    // 单元测试：新增的 KeywordMatcher / PhoneNumbers 为纯 Java 类，可直接在 JVM 上验证
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
